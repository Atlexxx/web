<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ContactHub — Viewer</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
/* --------------------------
    CARD STYLES
--------------------------- */
.card { transition: all 0.3s; background: white; border-radius: 0.75rem; border: 1px solid #cbd5e1; overflow: hidden; display: flex; flex-direction: column; }
.card.row { flex-direction: row; height: 140px; }
.card.col { height: auto; }
.card .thumb { background: #eef2ff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card.row .thumb { width: 120px; height: 100%; }
.card.col .thumb { width: 100%; aspect-ratio: 1/1; }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; }
.card .info { padding: 0.75rem; overflow: hidden; }

/* TAGS */
.tag, .filter-tag { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 0.25rem 0.65rem; border-radius: 9999px; font-size: 0.75rem; cursor: pointer; }
.tag.active, .filter-tag.active { background: #6366f1; color: white; }

/* GRID */
.grid.single-column { grid-template-columns: 1fr !important; }
.grid.three-column { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important; gap: 1rem; }

/* MODE BUTTONS */
.mode-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; cursor: pointer; background: white; }

/* LANGUAGE MENU */
.language-menu { position: relative; }
.language-menu-content { display: none; position: absolute; right: 0; top: 110%; background: white; min-width: 120px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); border-radius: 0.5rem; z-index: 50; border: 1px solid #e2e8f0; }
.language-menu-content button { display: block; width: 100%; padding: 0.75rem; text-align: left; border: none; background: none; cursor: pointer; }

/* QUEES FILTER BAR */
#queesFilterBar { display: flex; gap: 0.5rem; overflow-x: auto; padding: 0.25rem; scrollbar-width: none; -ms-overflow-style: none; }
#queesFilterBar::-webkit-scrollbar { display: none; }
.quees-btn { cursor: pointer; font-weight: 500; padding: 0.5rem 1.25rem; border-radius: 9999px; transition: all 0.2s; white-space: nowrap; background: white; border: 1px solid #e2e8f0; }
.quees-btn.active { background-color: #6366f1; color: white; border-color: #6366f1; }

/* MOBILE FILTER OVERLAY */
#mobileFilterOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: none; }
#mobileFilterDrawer { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-radius: 1.5rem 1.5rem 0 0; max-height: 80vh; overflow-y: auto; z-index: 101; transform: translateY(100%); transition: transform 0.3s ease-out; padding: 1.5rem; }
#mobileFilterDrawer.open { transform: translateY(0); }

/* ACCORDIONS */
.aside-card { background: #f8fafc; border-radius: 1rem; margin-bottom: 1rem; border: 1px solid #e2e8f0; }
.aside-card .accordion-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 1rem; cursor: pointer; }
.filter-container { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0 1rem 1rem 1rem; }
</style>
</head>

<body class="bg-slate-50 text-slate-900 pb-20 lg:pb-6">

<div class="min-h-screen">
    <header class="bg-white border-b sticky top-0 z-30 px-4 py-4 mb-4">
        <div class="max-w-6xl mx-auto space-y-4">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold">ContactHub</h1>
                    <div id="subtitle" class="text-xs text-slate-500"></div>
                </div>
                
                <div class="flex gap-2">
                    <div class="language-menu">
                        <button id="langBtn" class="px-3 py-1.5 text-sm border rounded-full bg-white">Llengua</button>
                        <div id="langMenu" class="language-menu-content">
                            <button data-lang="ca">Català</button>
                            <button data-lang="es">Castellà</button>
                            <button data-lang="en">English</button>
                        </div>
                    </div>
                    <div id="singleColBtn" class="mode-btn">☰</div>
                    <div id="normalColBtn" class="mode-btn">☷</div>
                </div>
            </div>

            <div class="flex flex-col gap-3">
                <input id="searchInput" type="search" placeholder="Cerca un contacte..." class="w-full p-3 rounded-xl border bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none transition-all" />
                <div id="queesFilterBar" class="pb-1"></div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-4 gap-6">
        <aside id="sidebar" class="hidden lg:block space-y-4">
            <div id="filterContent">
                </div>
        </aside>

        <section class="lg:col-span-3">
            <div id="grid" class="grid grid-cols-1 gap-4 transition-all duration-500"></div>
            <div id="noResults" class="hidden p-10 text-center bg-white rounded-2xl border border-dashed border-slate-300 text-slate-500 mt-4"></div>
        </section>
    </main>
</div>

<div class="lg:hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-40">
    <button onclick="toggleMobileFilters(true)" class="bg-slate-900 text-white px-8 py-3 rounded-full shadow-2xl flex items-center gap-2 font-medium">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
        Filtres
    </button>
</div>

<div id="mobileFilterOverlay" onclick="toggleMobileFilters(false)"></div>
<div id="mobileFilterDrawer">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold">Filtres</h2>
        <button onclick="toggleMobileFilters(false)" class="p-2 text-slate-400">Tancar</button>
    </div>
    <div id="mobileFilterContainer"></div>
</div>

<script>
/* ============================================================
                      DATA
============================================================ */
const contacts = [
  {"nom":"Pau Oriol Oliva","sobrenom":null,"any":"2007","nacionalitat":"Catalunya","desc":"(Unes frases que descriguin la personalitat...)","quees":"Millor Amic/Amiga,Familia","categoria":"Surfers,Festa,Madrid,Matrimoni,Confiança,Feina","imatge":"pau.jpg"},
  {"nom":"David Ardila Coronado","sobrenom":"Deimos","any":"2007","nacionalitat":"Catalunya","desc":"Jefe","quees":"Millor Amic/Amiga","categoria":"Duo,Insti,Insti Clase,Confiança","imatge":"david.jpg"},
  {"nom":"Bep Barneda Fusté","sobrenom":"Bepiii","any":"2007","nacionalitat":"Catalunya","desc":"Millor amic d’en Pau a Batxillerat, ara no.","quees":"Amic/Amiga","categoria":"Festa,Madrid,Matrimoni,Confiança","imatge":"bep.jpg"},
  {"nom":"Martí Ferrer","sobrenom":"Martrixx_","any":"2007","nacionalitat":"Catalunya","desc":"Geni.","quees":"Millor Amic/Amiga","categoria":"Festa,Surfers,Insti,Insti Clase,Confiança","imatge":"marti.jpg"},
  {"nom":"Laia Viton","sobrenom":null,"any":"2007","nacionalitat":"Catalunya","desc":"Una tiktoker mas.","quees":"Millor Amic/Amiga","categoria":"Feina,Confiança","imatge":"laia.jpg"},
  {"nom":"Fee Lina","sobrenom":null,"any":"2007","nacionalitat":"Alemania","desc":"Està bona, bastant guapa.","quees":"Conegut/Coneguda","categoria":"Càmping,Interès,Guiri","imatge":"fee.jpg"},
  {"nom":"Floor Van Dongen","sobrenom":"Xinita","any":"2009","nacionalitat":"Paisos Baixos","desc":"Podria ser l’amor de la meva vida.","quees":"Amic/Amiga,Conegut/Coneguda","categoria":"Càmping,Interès,Guiri,Confiança","imatge":"floor.jpg"},
  {"nom":"Iris Cramer","sobrenom":null,"any":"2009","nacionalitat":"Paisos Baixos","desc":"Actualment està fatal del cap.","quees":"Conegut/Coneguda","categoria":"Càmping,Interès,Guiri","imatge":"iris.jpg"},
  {"nom":"Joy","sobrenom":null,"any":"2007","nacionalitat":"Paisos Baixos","desc":"Molt bona persona quan vol.","quees":"Conegut/Coneguda","categoria":"Càmping,Guiri","imatge":"joy.jpg"},
  {"nom":"Indy Maners","sobrenom":null,"any":"2009","nacionalitat":"Paisos Baixos","desc":"Molt bona persona, molt guapa.","quees":"Amic/Amiga,Conegut/Coneguda","categoria":"Càmping,Interès,Guiri,Confiança","imatge":"indy.jpg"},
  {"nom":"Bram Van Dongen","sobrenom":null,"any":"2007","nacionalitat":"Paisos Baixos","desc":"Geni de surfers.","quees":"Amic/Amiga,Conegut/Coneguda","categoria":"Càmping,Guiri","imatge":"bram.jpg"},
  {"nom":"Bruno Rizzo","sobrenom":"Brizzo","any":"2007","nacionalitat":"Catalunya","desc":"Molt bona persona, gran amic per sempre.","quees":"Amic/Amiga,Conegut/Coneguda","categoria":"Insti Clase,Confiança,FM","imatge":"bruno.jpg"},
  {"nom":"Albert Budria","sobrenom":"Bertu","any":"2007","nacionalitat":"Catalunya","desc":"Molt bona persona, curiós.","quees":"Amic/Amiga,Conegut/Coneguda","categoria":"Insti Clase,FM","imatge":"albert.jpg"},
  {"nom":"Daniel Salas","sobrenom":"Dani","any":"2007","nacionalitat":"Catalunya","desc":"Nintendo player","quees":"Amic/Amiga,Conegut/Coneguda","categoria":"Insti Clase,Insti","imatge":"dani.jpg"},
  {"nom":"Pau Puig","sobrenom":"Fortia","any":"2007","nacionalitat":"Catalunya","desc":"Pau Puig (Roblox Player)","quees":"Amic/Amiga,Conegut/Coneguda","categoria":"Insti Clase,Insti","imatge":"paup.jpg"},
  {"nom":"Eduardo Nerio","sobrenom":"Edu Nerio","any":"2007","nacionalitat":"Catalunya","desc":"Mi negrito","quees":"Amic/Amiga,Conegut/Coneguda","categoria":"Insti Clase,Insti","imatge":"edu.jpg"},
  {"nom":"Celia","sobrenom":"Cece","any":"2007","nacionalitat":"Espanya","desc":"Cece.","quees":"Millor Amic/Amiga","categoria":"Confiança,Discord","imatge":"cece.jpg"},
  {"nom":"Alba","sobrenom":"Noche","any":"2009","nacionalitat":"Espanya","desc":"Bona amigueta","quees":"Millor Amic/Amiga,Amic/Amiga","categoria":"Confiança,Discord","imatge":"noche.jpg"},
  {"nom":"Nuria Trillo","sobrenom":null,"any":"2008","nacionalitat":"Catalunya","desc":"Els seus cumples serveixen de molt.","quees":"Amic/Amiga","categoria":"Discord","imatge":"nunu.jpg"},
  {"nom":"Raül Ruiz","sobrenom":null,"any":"2007","nacionalitat":"Catalunya","desc":"Salva uni","quees":"Millor Amic/Amiga","categoria":"Confiança,Uni,Uni Clase","imatge":"raul.jpg"},
  {"nom":"Marta","sobrenom":null,"any":"2006","nacionalitat":"Catalunya","desc":"Una companya/amiga d'uni","quees":"Amic/Amiga","categoria":"Uni,Uni Clase","imatge":"marta.jpg"},
  {"nom":"Iva","sobrenom":null,"any":"2007","nacionalitat":"Ucranía","desc":"Uni top tier","quees":"Millor Amic/Amiga","categoria":"Confiança,Uni,Uni Clase","imatge":"iva.jpg"},
  {"nom":"Ruth","sobrenom":null,"any":"2007","nacionalitat":"Catalunya","desc":"Companya beca..","quees":"Amic/Amiga","categoria":"Uni","imatge":"ruth.jpg"},
  {"nom":"Fátima","sobrenom":null,"any":"2009","nacionalitat":"Catalunya","desc":"Mora","quees":"Amic/Amiga","categoria":"Interés","imatge":"Fatima.jpg"}
];

let currentLang = 'ca';
let translations = { subtitle: "Gestió de contactes", langBtn: "Llengua", all: "Tots", noResults: "No s'han trobat resultats" };
let singleColumnMode = true;
let queesSelectValue = "All";

/* ============================================================
                      LOGIC
============================================================ */

function toggleMobileFilters(show) {
    const overlay = document.getElementById('mobileFilterOverlay');
    const drawer = document.getElementById('mobileFilterDrawer');
    if (show) {
        overlay.style.display = 'block';
        setTimeout(() => drawer.classList.add('open'), 10);
    } else {
        drawer.classList.remove('open');
        setTimeout(() => overlay.style.display = 'none', 300);
    }
}

function createAccordion(title, contentId) {
    return `
    <div class="aside-card">
        <button class="accordion-btn" onclick="this.nextElementSibling.classList.toggle('hidden')">
            <h3 class="font-semibold text-slate-800">${title}</h3>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <div class="filter-container" id="${contentId}"></div>
    </div>`;
}

function renderUI() {
    const filterHTML = 
        createAccordion('Categories', 'filterTags') +
        createAccordion('Nacionalitat', 'nacionalityFilters') +
        createAccordion('Any de naixement', 'yearFilters');
    
    document.getElementById('filterContent').innerHTML = filterHTML;
    document.getElementById('mobileFilterContainer').innerHTML = filterHTML;

    renderFilterOptions();
    renderQueesFilterBar();
    filterContacts();
}

function renderFilterOptions() {
    const categories = Array.from(new Set(contacts.flatMap(c => c.categoria.split(',').map(s => s.trim())))).sort();
    const nats = Array.from(new Set(contacts.map(c => c.nacionalitat))).sort();
    const years = Array.from(new Set(contacts.map(c => c.any))).sort();

    const fill = (list, containerId) => {
        const containers = document.querySelectorAll(`[id='${containerId}']`);
        containers.forEach(container => {
            container.innerHTML = '';
            list.forEach(item => {
                const span = document.createElement('span');
                span.className = 'filter-tag';
                span.textContent = item;
                span.dataset.value = item;
                span.onclick = () => {
                    document.querySelectorAll(`[data-value='${item}']`).forEach(el => el.classList.toggle('active'));
                    filterContacts();
                };
                container.appendChild(span);
            });
        });
    };

    fill(categories, 'filterTags');
    fill(nats, 'nacionalityFilters');
    fill(years, 'yearFilters');
}

function renderQueesFilterBar() {
    const bar = document.getElementById('queesFilterBar');
    const options = ["All", "Millor Amic/Amiga", "Amic/Amiga", "Familia", "Conegut/Coneguda"];
    bar.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = `quees-btn ${queesSelectValue === opt ? 'active' : ''}`;
        btn.textContent = opt === "All" ? "Tots" : opt;
        btn.onclick = () => {
            queesSelectValue = opt;
            renderQueesFilterBar();
            filterContacts();
        };
        bar.appendChild(btn);
    });
}

function filterContacts() {
    const term = document.getElementById('searchInput').value.toLowerCase();
    const activeCats = Array.from(document.querySelectorAll('#filterTags .active:not(.tag)')).map(s => s.dataset.value);
    const activeNats = Array.from(document.querySelectorAll('#nacionalityFilters .active')).map(s => s.dataset.value);
    const activeYears = Array.from(document.querySelectorAll('#yearFilters .active')).map(s => s.dataset.value);

    // Get unique active cats (since we have desktop and mobile copies)
    const uniqueCats = [...new Set(activeCats)];
    const uniqueNats = [...new Set(activeNats)];
    const uniqueYears = [...new Set(activeYears)];

    const filtered = contacts.filter(c => {
        const matchesSearch = c.nom.toLowerCase().includes(term) || (c.sobrenom?.toLowerCase().includes(term));
        const matchesQuees = queesSelectValue === 'All' ? true : c.quees.includes(queesSelectValue);
        const matchesCats = uniqueCats.length === 0 ? true : uniqueCats.every(cat => c.categoria.includes(cat));
        const matchesNats = uniqueNats.length === 0 ? true : uniqueNats.includes(c.nacionalitat);
        const matchesYears = uniqueYears.length === 0 ? true : uniqueYears.includes(c.any);
        return matchesSearch && matchesQuees && matchesCats && matchesNats && matchesYears;
    });

    renderContacts(filtered);
}

function renderContacts(list) {
    const grid = document.getElementById('grid');
    const noResults = document.getElementById('noResults');
    grid.innerHTML = '';
    
    if (list.length === 0) {
        noResults.classList.remove('hidden');
        noResults.textContent = translations.noResults;
        return;
    }
    noResults.classList.add('hidden');

    grid.className = `grid gap-4 ${singleColumnMode ? 'single-column' : 'three-column'}`;

    list.forEach(c => {
        const div = document.createElement('div');
        div.className = `card ${singleColumnMode ? 'row' : 'col'}`;
        div.innerHTML = `
            <div class="thumb"><img src="img/${c.imatge}" onerror="this.src='https://via.placeholder.com/150?text=User'" /></div>
            <div class="info">
                <h3 class="font-bold text-slate-900 truncate">${c.nom}${c.sobrenom ? ` (${c.sobrenom})` : ''}</h3>
                <p class="text-xs text-slate-500 mb-2">${c.nacionalitat} • ${c.any}</p>
                <p class="text-sm text-slate-600 line-clamp-2 mb-2">${c.desc}</p>
                <div class="flex flex-wrap gap-1">${c.categoria.split(',').slice(0, 3).map(cat => `<span class="tag">${cat.trim()}</span>`).join('')}</div>
            </div>`;
        grid.appendChild(div);
    });
}

document.getElementById('searchInput').oninput = filterContacts;
document.getElementById('singleColBtn').onclick = () => { singleColumnMode = true; filterContacts(); };
document.getElementById('normalColBtn').onclick = () => { singleColumnMode = false; filterContacts(); };
document.getElementById('langBtn').onclick = (e) => {
    e.stopPropagation();
    const menu = document.getElementById('langMenu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
};
document.addEventListener('click', () => document.getElementById('langMenu').style.display = 'none');
document.querySelectorAll('#langMenu button').forEach(btn => {
    btn.onclick = () => { currentLang = btn.dataset.lang; renderUI(); };
});

renderUI();
</script>
